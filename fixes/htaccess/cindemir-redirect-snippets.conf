# Flatten www → apex in one hop (Apache)
# Place near the TOP of the WordPress .htaccess, BEFORE the WordPress block.

<IfModule mod_rewrite.c>
RewriteEngine On

# www → non-www HTTPS (single hop)
RewriteCond %{HTTP_HOST} ^www\.cindemirlaw\.com$ [NC]
RewriteRule ^ https://cindemirlaw.com%{REQUEST_URI} [R=301,L]

# http → https for apex (if not already forced by host)
RewriteCond %{HTTPS} !=on
RewriteCond %{HTTP_HOST} ^cindemirlaw\.com$ [NC]
RewriteRule ^ https://cindemirlaw.com%{REQUEST_URI} [R=301,L]

# Flatten press/link9 chains
RewriteRule ^link9/?$ https://cindemir.av.tr/en/we-are-in-news/ [R=301,L]
RewriteRule ^press/?$ https://cindemir.av.tr/en/we-are-in-news/ [R=301,L]
</IfModule>
